[project]
name = "phiroom-control"
version = "2.0.1"
requires-python = ">=3.11,<3.12"
dependencies = ["phiroom", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<9", "numpy>=1.26,<3", "scipy>=1.12,<2", "Pillow>=10,<13", "pydantic>=2,<3", "ruff>=0.11", "trimesh>=4,<5", "torch==2.9.1"]

# Full CPU regression suite; optional so command planning stays lightweight.
regression = [
  "numpy>=1.26,<2", "pybullet>=3.2.7,<4", "mujoco==3.10.0", "matplotlib>=3.8,<4", "opencv-python-headless>=4.10,<4.12",
  "rtree>=1.4,<2", "plyfile>=1.1,<2", "scikit-learn>=1.5,<2", "imageio>=2,<3",
  "openpi-client", "imageio-ffmpeg>=0.5,<1", "pandas>=2,<4", "open3d>=0.19,<0.20",
]

[tool.uv.sources]
openpi-client = { git = "https://github.com/xuningy/openpi.git", rev = "aa6420561529593114160d05e5ad155792b272f3", subdirectory = "packages/openpi-client" }
phiroom = { path = "../..", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
