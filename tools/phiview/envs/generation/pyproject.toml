[project]
name = "phiview-generation-env"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "physicalview",
  "torch==2.4.1+cu124",
  "torchvision==0.19.1+cu124",
  "xformers==0.0.28.post1",
  "gsplat==1.5.3",
  "open3d==0.19.0",
  "spconv-cu120",
  "coacd",
  "pybullet",
  "transformers==4.57.6",
  "accelerate",
  "safetensors",
  "sentencepiece",
  "einops",
  "easydict",
  "utils3d",
  "tqdm",
  "rich",
  "lxml",
  "ninja",
  "setuptools",
  "imageio-ffmpeg"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
physicalview = { path = "../..", editable = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "a29e9c13504cbb92c4489706c7f2a8e0bc4f7af8" }
xformers = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.extra-build-dependencies]
gsplat = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
gsplat = { BUILD_NO_CUDA = "1" }
