# Portable defaults. Use physicalview init for your paths. Cluster example: cluster/insait.yaml.
simany_root: backends/simany
outputs_root: ${PHYSICALVIEW_ROOT}/outputs/scenes
scannetpp_root: ${PHYSICALVIEW_ROOT}/data/scannetpp
splats_root: ${PHYSICALVIEW_ROOT}/data/splats
studio_out: ${PHYSICALVIEW_ROOT}/outputs/jobs
interpreters:
  main: ${PHYSICALVIEW_ROOT}/envs/generation/.venv/bin/python
  sam3: ${PHYSICALVIEW_ROOT}/envs/inference/.venv/bin/python
  studio: ${PHYSICALVIEW_ROOT}/envs/studio/.venv/bin/python
  gsplat: ${PHYSICALVIEW_ROOT}/envs/studio/.venv/bin/python
  sam3d: ${SIMANY_ROOT}/.envs/sam3d-objects/bin/python
  openpi: ${PHYSICALVIEW_ROOT}/backends/openpi/.venv/bin/python
env_arch_support:
  main:
  - '8.0'
  - '8.6'
  - '8.9'
  - '9.0'
  sam3:
  - '8.0'
  - '8.6'
  - '8.9'
  - '9.0'
  - '12.0'
  sam3d:
  - '8.0'
  - '8.6'
  - '8.9'
  - '9.0'
  gsplat:
  - '8.0'
  - '8.6'
  - '9.0'
  studio:
  - '8.0'
  - '8.6'
  - '9.0'
  - '12.0'
  openpi:
  - '8.0'
  - '8.6'
  - '9.0'
slurm:
  account: null
  gpu_types:
    a6000:
      partition: gpu
      gres: gpu:a6000:1
      extra: []
      compute_cap: '8.6'
      mem: 64G
      time: 03:50:00
    h200:
      partition: gpu
      gres: gpu:h200:1
      extra: []
      compute_cap: '9.0'
      mem: 96G
      time: 03:50:00
    a100:
      partition: gpu
      gres: gpu:a100-80g:1
      extra: []
      compute_cap: '8.0'
      mem: 96G
      time: 03:50:00
    rtx6000:
      partition: gpu
      gres: gpu:rtx6000:1
      extra: []
      compute_cap: '12.0'
      mem: 96G
      time: 03:50:00
  default_remote_gpu: a6000
  env_exports:
    HF_HOME: ${PHYSICALVIEW_ROOT}/weights/huggingface
    TORCH_HOME: ${PHYSICALVIEW_ROOT}/weights/torch
    HF_HUB_OFFLINE: '1'
    MUJOCO_GL: egl
models:
  discovery:
  - id: gt_segments
    label: GT segments (ScanNet++ annotations)
    stage: discover_gt
  - id: sam3_auto
    label: SAM3 automatic discovery (no GT)
    stage: discover_auto
  generation:
  - id: trellis
    label: TRELLIS (single best view)
    module: models.s4_trellis
    env: main
  - id: reconviagen
    label: ReconViaGen (multi-view)
    module: models.s4_reconviagen
    env: main
  - id: sam3d
    label: SAM 3D Objects
    module: models.s4_sam3d
    env: sam3d
  - id: hybrid
    label: 'Hybrid: evidence-gated TRELLIS/ReconViaGen'
    module: agents.assets.factory_hybrid
    env: main
  registration:
  - id: yaw_sweep_icp
    label: Sim(3) yaw sweep + ICP (default)
    module: agents.assets.factory_align
    env: main
    args: []
  - id: signed_source_up
    label: Sim(3) with signed source-up hypothesis
    module: agents.assets.factory_align
    env: main
    args:
    - --source-up
    - signed
  - id: alt_source_up
    label: Sim(3) with alternative source-up
    module: agents.assets.factory_align
    env: main
    args:
    - --source-up
    - alternative
  inpaint_backends:
  - id: qwen_image_edit
    label: Qwen-Image-Edit (prompted)
    env: sam3
    min_vram_gb: 40
  - id: lama
    label: LaMa (CPU, no prompt)
    env: main
    min_vram_gb: 0
  collision_modes:
  - room
  - shim
  policies:
  - pi05_droid_jointpos
  - droid_pi05_jointpos_with_web_and_sim
  - scripted_sinusoid
policy_server:
  script: run/pi05_serve.sh
  default_port: 8000
  gpu_types:
  - a6000
  - h200
viewer:
  port: 8080
  display_mode: server
  stream:
    max_width: 1280
    jpeg_quality: 80
    max_fps: 15
    moving_scale: 0.5
  max_splats_background: 400000
  max_splats_object: 40000
  render_wh:
  - 640
  - 360
  control_hz: 15
