# Distractor-rejection via an explicit rubric spatial qualifier instead of
# proximity-to-receptacle: no receptacle role is requested at all, so the
# only disambiguator between the two same-label mugs is the "nearest_to_base"
# hint. Also checks that the qualifier doesn't let an unrelated-but-literally
# -closer object (obj_08 "cup", no label evidence) win just on proximity.
task_id: spatial_hint_demo

language:
  instruction: "pick up the mug"

rubric:
  role_labels:
    manipulated_object: mug
  spatial_hints:
    manipulated_object: nearest_to_base

roles: [manipulated_object]
