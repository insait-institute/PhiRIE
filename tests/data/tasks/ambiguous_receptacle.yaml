# manipulated_object is pinned unambiguously (via role_refs) so the fixture
# isolates a genuinely ambiguous *receptacle*: no role_labels, no
# language destination phrase, and the scene has two receptacle-category
# objects (tray obj_00, bowl obj_07) with nothing to tell them apart.
# Expect role_resolutions.receptacle.status == "ambiguous", not an
# arbitrary single pick.
task_id: ambiguous_receptacle_demo

language:
  instruction: "pick up the mug"

rubric:
  role_refs:
    manipulated_object: obj_01

roles: [manipulated_object, receptacle]
