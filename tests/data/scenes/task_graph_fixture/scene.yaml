# Synthetic scene fixture for tests/test_task_graph.py and the Task 11 fast-
# validation command. Not a real reconstructed scene -- coordinates are
# hand-placed to exercise specific grounding paths (see the comment on each
# object). Units are meters, robot-base/world frame, x forward / y left /
# z up, matching robo/tasks/pi05_tasks.py's convention.
scene_id: task_graph_fixture

robot:
  base_pos: [0.0, 0.0, 0.74]
  base_yaw: 0.0
  reach_envelope_m: 0.80
  reach_min_m: 0.15
  front_cone_deg: 75.0

cameras:
  # Sees the whole tabletop cluster (tray/placemat/mug/distractor-mug/bowl)
  # plus the swept-workspace obstacle "cup"; does not reach the distant
  # mug/chair.
  - id: ext_cam
    pos: [0.10, 0.65, 1.00]
    look_at: [0.40, 0.05, 0.80]
    fovy_deg: 80.0
    max_range_m: 1.6
  # Narrower wrist-style camera, closer to the manipulated cluster only.
  - id: wrist_cam
    pos: [0.30, 0.02, 0.95]
    look_at: [0.40, 0.10, 0.78]
    fovy_deg: 70.0
    max_range_m: 0.7

objects:
  # Receptacle candidate A: the tray the rubric/language actually name.
  - id: obj_00
    label: tray
    category: receptacle
    aabb: [[0.32, -0.20, 0.760], [0.50, 0.00, 0.775]]
    pose: {pos: [0.41, -0.10, 0.7675], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Support surface: a placemat resting directly on the (unmodeled) table.
  - id: obj_05
    label: placemat
    category: support
    aabb: [[0.30, 0.04, 0.760], [0.46, 0.20, 0.762]]
    pose: {pos: [0.38, 0.12, 0.761], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Manipulated-object candidate A (the correct one): a mug resting on the
  # placemat, near the tray. Well-evidenced by rubric label + language +
  # geometric proximity to the receptacle, and geometrically supported by
  # obj_05 (bottom z == placemat top z, xy center inside placemat footprint).
  - id: obj_01
    label: mug
    category: graspable
    aabb: [[0.34, 0.08, 0.762], [0.42, 0.16, 0.842]]
    pose: {pos: [0.38, 0.12, 0.802], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Manipulated-object candidate B: a same-label distractor mug. In camera
  # view and in the reach envelope (so any exclusion has to come from lack
  # of evidence, not from the eligibility gate), but far from the tray and
  # not resting on anything -- must NOT win on label alone.
  - id: obj_02
    label: mug
    category: graspable
    aabb: [[0.56, 0.28, 0.760], [0.64, 0.36, 0.840]]
    pose: {pos: [0.60, 0.32, 0.800], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Second receptacle-category candidate, used by the ambiguous-receptacle
  # task fixture (no rubric label disambiguates tray vs. bowl there).
  - id: obj_07
    label: bowl
    category: receptacle
    aabb: [[0.44, 0.24, 0.760], [0.54, 0.34, 0.800]]
    pose: {pos: [0.49, 0.29, 0.780], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Swept-workspace obstacle: sits almost exactly on the base->mug reach
  # path, distinct label ("cup", never "mug") so it can only ever be picked
  # up as an 'obstacle' via geometry, never as a manipulated_object via
  # label/language evidence.
  - id: obj_08
    label: cup
    category: graspable
    aabb: [[0.16, 0.02, 0.760], [0.22, 0.08, 0.820]]
    pose: {pos: [0.19, 0.05, 0.790], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Distant same-category distractor: same label as the manipulated object
  # ("mug") but outside both the reach envelope and every camera frustum,
  # and never referenced by any rubric role_ref. Must be excluded from the
  # graph entirely (not merely down-ranked).
  - id: obj_09
    label: mug
    category: graspable
    aabb: [[2.40, 1.40, 0.760], [2.48, 1.48, 0.840]]
    pose: {pos: [2.44, 1.44, 0.800], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

  # Distant irrelevant furniture, different category -- general "far away
  # object" sanity check alongside the same-category one above.
  - id: obj_06
    label: chair
    category: furniture
    aabb: [[3.00, -2.00, 0.000], [3.60, -1.40, 0.900]]
    pose: {pos: [3.30, -1.70, 0.450], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}
