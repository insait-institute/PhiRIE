name: module-contracts

on:
  pull_request:
    paths: ['phiroom/**', 'simfactory/**', 'envs/control/**', 'pipelines/**', 'tools/release/**', 'run/phiroom.sh', 'tests/test_module_interfaces.py', 'pyproject.toml', '.gitmodules', '.github/workflows/module-contracts.yml']
  push:
    branches: [main]
    paths: ['phiroom/**', 'simfactory/**', 'envs/control/**', 'pipelines/**', 'tools/release/**', 'run/phiroom.sh', 'tests/test_module_interfaces.py', 'pyproject.toml', '.gitmodules', '.github/workflows/module-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.31
      - name: Install locked control environment
        run: uv sync --project envs/control --locked
      - name: Module contracts
        run: |
          uv run --project envs/control --locked ruff check phiroom tests/test_module_interfaces.py tools/release
          uv run --project envs/control --locked pytest -q tests/test_module_interfaces.py tests/test_release_source_integrity.py
          uv run --project envs/control --locked python tools/release/verify.py
      - name: Existing campaign preflight
        run: bash run/phiroom.sh pipeline run pipelines/preflight.json
      - name: Build distributions
        run: uv build
