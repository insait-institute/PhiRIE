name: module-contracts

on:
  pull_request:
    paths: ['phiroom/**', 'robo/simfactory/**', 'envs/control/**', 'tools/release/**', 'run/phiroom.sh', 'pyproject.toml', '.github/workflows/module-contracts.yml']
  push:
    branches: [main]
    paths: ['phiroom/**', 'robo/simfactory/**', 'envs/control/**', 'tools/release/**', 'run/phiroom.sh', 'pyproject.toml', '.github/workflows/module-contracts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.31
      - name: Install locked control environment
        run: uv sync --project envs/control --locked
      - name: Module contracts
        run: |
          uv run --project envs/control --locked ruff check phiroom robo/simfactory tools/release
          uv run --project envs/control --locked python tools/release/verify.py
          bash run/phiroom.sh modules
      - name: Build distributions
        run: uv build
