name: paper-code-ci

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'envs/control/**'
      - 'pyproject.toml'
      - 'robo/eval/**'
      - 'robo/rendering/**'
      - 'integrations/harmonizer/**'
      - 'configs/experiments/**'
      - 'tests/test_*.py'
      - 'tests/test_harness*.py'
      - 'tests/test_robot_restore.py'
      - 'tests/test_main_table.py'
      - '.github/workflows/paper-code-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-code-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU regression dependencies
        run: |
          python -m pip install uv==0.11.31
          uv sync --project envs/control --locked --group regression
      - name: Compile paper modules
        run: envs/control/.venv/bin/python -m compileall -q robo/eval robo/rendering integrations/harmonizer
      - name: Run paper-code tests
        env:
          MUJOCO_GL: disable
        run: |
          mkdir -p .tmp
          envs/control/.venv/bin/python -m pytest -q --basetemp=.tmp/pytest-paper-code \
            tests/test_robot_restore.py \
            tests/test_harness_spec.py \
            tests/test_harness_validation.py \
            tests/test_main_table.py \
            tests/test_audit_metrics.py \
            tests/test_audit_loso.py \
            tests/test_fidelity_metrics.py \
            tests/test_construction_metrics.py \
            tests/test_harmony_visual_metrics.py \
            tests/test_real_world_metrics.py \
            tests/test_harmonizer_protocol.py \
            tests/test_harness_smoke.py \
            tests/test_observation_pipeline.py
      - name: Write CI status
        if: always()
        shell: bash
        run: |
          mkdir -p paper-code-ci
          cat > paper-code-ci/status.json <<EOF
          {
            "workflow": "paper-code-ci",
            "commit": "${GITHUB_SHA}",
            "job_status": "${{ job.status }}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF
      - name: Upload CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-code-ci-report
          path: paper-code-ci/status.json
          if-no-files-found: error
