name: gaussian-system-campaign
on:
  push:
    branches: [main]
    paths:
      - 'robo/campaign/**'
      - 'robo/eval/final_release.py'
      - 'robo/rendering/final_observation.py'
      - 'tests/test_system_campaign.py'
      - 'tests/test_final_experiments.py'
      - 'tests/test_final_entrypoints.py'
      - 'run/campaign/finalize.sh'
      - 'run/campaign/final_preflight.sh'
      - 'run/finalize/run.sh'
      - 'plan/icra2027/14_finalization/**'
      - 'plan/icra2027/ACTIVE_CAMPAIGN.md'
      - 'FINAL_EXPERIMENTS.md'
      - 'configs/experiments/final_submission/**'
      - '.github/workflows/gaussian-system-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gaussian-system-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install numpy scipy pillow pyyaml pytest trimesh
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test contracts and numerical code, not pretrained models
        env:
          PYTHONPATH: ${{ github.workspace }}
          SIMANY_TEST_REPO_ROOT: ${{ github.workspace }}
        run: |
          bash run/campaign/final_preflight.sh
          python -m compileall -q robo/campaign robo/eval/final_release.py robo/rendering/final_observation.py
          git diff --check
