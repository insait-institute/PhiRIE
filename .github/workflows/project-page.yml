name: project-page

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/project-page.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        working-directory: website
        run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check and build
        working-directory: website
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run format:check
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
