# Builds and deploys the project page (https://insait-institute.github.io/PhiRIE/).
# The page source lives on the `website` branch of this repository; `main`
# carries only the released code. Pushes to `website` deploy automatically;
# the workflow can also be dispatched manually or by a `website-updated`
# repository_dispatch event.
name: project-page

on:
  push:
    branches: [website]
  workflow_dispatch:
  repository_dispatch:
    types: [website-updated]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website source (branch website)
        uses: actions/checkout@v4
        with:
          ref: website
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install locked website dependencies
        working-directory: source
        run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check and build
        working-directory: source
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run format:check
          npm run build
      - name: Record the source commit
        working-directory: source
        run: git rev-parse HEAD > dist/SOURCE_COMMIT
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
