[project]
name = "phiview-studio-env"
version = "0.2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "physicalview",
  "torch==2.9.1+cu128",
  "torchvision==0.24.1+cu128",
  "gsplat==1.5.3",
  "open3d==0.19.0",
  "imageio-ffmpeg==0.6.0",
  "ninja",
  "setuptools",
  "utils3d",
  "einops",
  "tqdm",
  "pyopengl",
  "moderngl==5.12.0",
  "glcontext==3.0.0",
  "openpi-client"
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
physicalview = { path = "../..", editable = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "a29e9c13504cbb92c4489706c7f2a8e0bc4f7af8" }
openpi-client = { git = "https://github.com/xuningy/openpi.git", rev = "aa6420561529593114160d05e5ad155792b272f3", subdirectory = "packages/openpi-client" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
gsplat = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
gsplat = { BUILD_NO_CUDA = "1" }

[dependency-groups]
dev = ["pytest==9.0.2"]
