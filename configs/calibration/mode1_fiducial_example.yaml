# Mode 1 (fiducial/ChArUco) example calibration config for
# agents/recon/robot_align.py:
#   .venv/bin/python -m agents.recon.robot_align \
#       --config configs/calibration/mode1_fiducial_example.yaml
#
# `correspondences.calib` are ChArUco-corner (or any fiducial) positions:
# `src` as reconstructed in the scan/SfM frame, `dst` as the SAME physical
# corner's known position in the robot-base frame (surveyed, or read off
# the board's known geometry relative to a base-mounted board). At least
# one held_out corner - never used to fit - is required for a trustworthy
# certificate (see alignment_report.py: fit-only residual is downgraded to
# "ACCEPT_NO_HELDOUT_EVIDENCE" at best, never a plain ACCEPT).
#
# Numbers below are synthetic but INTERNALLY CONSISTENT: generated by
# applying one true Sim(3) (scale 0.985, ~12 deg yaw + 3 deg tilt) plus 4mm
# marker-detection noise, so the example demonstrates a clean ACCEPT rather
# than standing in for a real capture.

mode: fiducial
scene_id: c50d2d1d42_charuco_example

correspondences:
  calib:
    - src: [0.9472, -0.9363, 0.0785]
      dst: [0.100, 0.050, 0.000]
      label: charuco_corner_00
    - src: [1.2415, -0.8761, 0.0723]
      dst: [0.400, 0.050, 0.000]
      label: charuco_corner_01
    - src: [0.8841, -0.6346, 0.0621]
      dst: [0.100, 0.350, 0.000]
      label: charuco_corner_02
    - src: [1.1793, -0.5748, 0.0622]
      dst: [0.400, 0.350, 0.000]
      label: charuco_corner_03
    - src: [1.0649, -0.7492, 0.2931]
      dst: [0.250, 0.200, 0.220]
      label: survey_post_marker
  held_out:
    - src: [1.0673, -0.7625, 0.0683]
      dst: [0.250, 0.200, 0.000]
      label: charuco_center_holdout

solver:
  allow_scale: true      # scan is arbitrary-scale SfM; recover metric scale too
  robust: true
  ransac: true
  huber_delta_m: 0.02
  ransac_iters: 500
  ransac_inlier_thresh_m: 0.03
  min_inliers: 3
  bootstrap_ci: true
  n_boot: 200
  rng: 0

output:
  dir: outputs/c50d2d1d42_charuco_example/calibration
  report_json: outputs/c50d2d1d42_charuco_example/calibration/align_report.json
  overlay_png: outputs/c50d2d1d42_charuco_example/calibration/align_overlay.png
