# Prospective source-independent timeline. No frozen run/config is assigned yet.
# resolve_final requires exact E3/E9 and footage identities before encoding.
schema_version: 2
mode: final
freeze_id: UNASSIGNED
source_root: /group/worldcept/code/SimAny
resolution: [1920, 1080]
fps: 30
selector_rule: scene_id_ascending_no_quality_or_policy_outcome_v1
# Never ranks by learned-policy success or held-out geometry quality.
hero_rule:
  minimum_accepted_objects: 4
  order: [scene_id_ascending]
  prerequisites: [clean_background, full_room_collision, genuine_synchronized_episode]
  physical_success_required: false
required_roles: [capture, reconstruction, selection, retry, identity, synchronized_episode, harmonizer, scale, real_capture, results]
# The application consumes materialized shot records with source IDs/hash refs.
# These durations are fixed prospectively before any eligible policy footage.
hero_durations_s:
  capture: 8
  reconstruction: 8
  selection: 10
  retry: 6
  identity: 12
  synchronized_episode: 13
  harmonizer: 14
  scale: 5
  real_capture: 7
  results: 7
teaser_durations_s:
  capture: 3
  reconstruction: 3
  selection: 4
  retry: 3
  identity: 4
  synchronized_episode: 5
  real_capture: 3
  results: 5
loop:
  duration_s: 8
  kind: authentic_evidence_hold
  policy_motion_looping: false
# Missing source records stay missing. No black-card/source substitution.
execution_contract: null
harmonizer_gate: null
sources: []
timelines: {}
