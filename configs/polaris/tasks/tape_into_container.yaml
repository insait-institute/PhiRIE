robot:
  source: src/polaris/environments/robot_cfg.py:9-65 (NVIDIA_DROID ArticulationCfg)
  usd_path_relative_to_data_root: nvidia_droid/noninstanceable.usd
  reset_joint_pos_rad:
    panda_joint1: 0.0
    panda_joint2: -0.6283185307179586
    panda_joint3: 0.0
    panda_joint4: -2.5132741228718345
    panda_joint5: 0.0
    panda_joint6: 1.8849555921538759
    panda_joint7: 0.0
    finger_joint: 0.0
  reset_joint_pos_rad_as_7_vector:
  - 0.0
  - -0.6283185307179586
  - 0.0
  - -2.5132741228718345
  - 0.0
  - 1.8849555921538759
  - 0.0
  note_vs_simany_frozen_fields: IDENTICAL to configs/experiments/frozen_fields.yaml robot.reset_pose_rad
    [0,-pi/5,0,-4pi/5,0,3pi/5,0] -- both trace to the same DROID convention. This is a genuine, checked
    frozen-field match, not a coincidence.
  gravity_disabled: true
  self_collisions_enabled: false
  solver_position_iteration_count: 64
  solver_velocity_iteration_count: 0
  actuators:
    panda_shoulder (joints 1-4):
      effort_limit: 87.0
      velocity_limit: 2.175
      stiffness: 400.0
      damping: 80.0
    panda_forearm (joints 5-7):
      effort_limit: 12.0
      velocity_limit: 2.61
      stiffness: 400.0
      damping: 80.0
    gripper (finger_joint):
      effort_limit: 200.0
      velocity_limit: 5.0
      stiffness: null
      damping: null
action:
  source: src/polaris/environments/droid_cfg.py:230-244 (ActionCfg)
  arm:
    type: JointPositionActionCfg
    joints: panda_joint.*  (7 joints)
    use_default_offset: false
    convention: absolute_joint_position
  gripper:
    type: BinaryJointPositionZeroToOneActionCfg (custom subclass, droid_cfg.py:196-227)
    input_range: '[0, 1] (or bool)'
    binarize_threshold: 0.5
    open_command_rad: 0.0
    close_command_rad: 0.7853981633974483
  action_dim: 8
  note_vs_simany_frozen_fields: IDENTICAL action_dim (8 = 7 absolute joint + 1 gripper) and action_convention
    (absolute_joint_position) and gripper_binarize_threshold (0.5) to configs/experiments/frozen_fields.yaml.
    Genuine, checked match.
control:
  source: src/polaris/environments/droid_cfg.py:339-364 (EnvCfg.__post_init__)
  decimation: 8
  sim_dt_s: 0.008333333333333333
  control_dt_s: 0.06666666666666667
  control_rate_hz: 15.0
  render_interval: 8
  episode_length_s: 30
  rerender_on_reset: true
  note_vs_simany_frozen_fields: 'control_rate_hz matches configs/experiments/frozen_fields.yaml (15 Hz)
    exactly -- genuine match, even though the two simulators reach it via different substep counts (PhysX
    8 x 1/120 vs MuJoCo 40 x 1/600). horizon_seconds does NOT match: official PolaRiS uses 30s (episode_length_s
    above); SimAny''s frozen_fields.yaml uses 32s (sourced from a documented docs/ROBOT.md gotcha about
    the MuJoCo suite''s default being too short, not from PolaRiS). This is a real, declared difference
    -- if this pairing is ever run, either pin both to the same horizon or report it as an acknowledged
    non-frozen field.'
rubric:
  source: src/polaris/environments/__init__.py:120-136
  criteria:
  - fn: reach
    args:
      obj: tape_00
      threshold: 0.2
    depends_on: []
  - fn: lift
    args:
      obj: tape_00
      threshold: 0.04
    depends_on:
    - 0
  - fn: is_within_xy
    args:
      obj1: tape_00
      obj2: container_02
      percent_threshold: 0.8
    depends_on:
    - 1
  note_vs_simany: 'STRUCTURALLY DIFFERENT from SimAny''s rubric, not just re-labeled: PolaRiS''s Rubric
    (rubrics/base.py) takes a variable-length list of criteria (3-7 depending on task) with an explicit
    dependency graph between them, and progress = (count of criteria EVER satisfied) / (total criteria)
    -- success requires ALL criteria ever-satisfied. SimAny''s TaskScorer (robo/tasks/pi05_tasks.py) is
    a fixed 4-stage {grasp,lift,hover,place} rubric at 0.25 credit/stage (configs/experiments/frozen_fields.yaml:
    rubric). These are NOT directly comparable progress scores without an explicit declared mapping (e.g.
    PolaRiS''s reach+lift roughly correspond to SimAny''s grasp+lift; PolaRiS has no ''hover'' analog;
    PolaRiS''s is_within_xy roughly corresponds to SimAny''s place, but checked continuously against a
    persistent max-ever-reached flag rather than a 1s-hold window). task_adapter.py would need to either
    (a) implement one rubric on both sides, or (b) declare and test an explicit progress mapping -- neither
    is done here.'
