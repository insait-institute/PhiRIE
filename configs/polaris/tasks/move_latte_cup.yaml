  - 0.0
  - -0.6283185307179586
  - 0.0
  - -2.5132741228718345
  - 0.0
  - 1.8849555921538759
  - 0.0
  note_vs_simany_frozen_fields: IDENTICAL to configs/experiments/frozen_fields.yaml robot.reset_pose_rad
    [0,-pi/5,0,-4pi/5,0,3pi/5,0] -- both trace to the same DROID convention. This is a genuine, checked
    frozen-field match, not a coincidence.
  gravity_disabled: true
  self_collisions_enabled: false
  solver_position_iteration_count: 64
  solver_velocity_iteration_count: 0
  actuators:
    panda_shoulder (joints 1-4):
      effort_limit: 87.0
