# Task 09 fast-validation config (plan/09_PAIRED_ROLLOUT_RUNNER.md):
#
#   .venv/bin/python -m robo.eval.paired_runner \
#       --config configs/experiments/paired_smoke.yaml --episodes 2
#
# SMOKE ONLY -- horizon_s below is deliberately far shorter than the frozen
# 32s (configs/experiments/frozen_fields.yaml: control.horizon_seconds) so
# this finishes in minutes. Both conditions still see the IDENTICAL
# (shortened) horizon, so the run remains a legal mujoco_paired comparison
# -- just not a benchmark-valid one, the same "demo vs. benchmark"
# distinction frozen_fields.yaml's demo_only_overrides_never_for_benchmark
# section draws for its own knobs. A real matrix config should drop
# `horizon_s` entirely so it falls back to the frozen 32s default.
#
# Policy is `scripted_sinusoid` (frozen_fields.yaml's checkpoint-free
# smoke-test entry) -- NOT a real openpi server, so this needs no GPU
# serving process and no checkpoint download, per the Task 09 brief ("no
# running policy server in this environment").
#
# Scene is outputs/c50d2d1d42_factory: a real SimAny factory build with a
# real sim_export/pi05_tasks.json + scene.xml already on disk (see
# docs/ROBOT.md's scene list). robo/eval/reference_scene.py builds the
# paired "reference" primitive-box variant of this SAME scene on first run.
policy: scripted_sinusoid
seeds: [0]
episodes: 1
horizon_s: 6.0
jitter: 0.0
variant: default
video: true
render_wh: [640, 360]
policy_timeout_s: 20.0
conditions: [simany, reference]

scenes:
  - id: c50d2d1d42_factory
    factory_dir: outputs/c50d2d1d42_factory
    tasks_json: outputs/c50d2d1d42_factory/sim_export/pi05_tasks.json

out_dir: outputs/paired_runs/paired_smoke
