# Machine-readable companion to docs/ICRA_RESEARCH_CONTRACT.md.
# Validated by `python -m agents.eval.validate_contract <this file> --strict`.
# Do not hand-edit table cells to match this file after the fact — this file
# freezes the plan; results are generated from manifests and checked against it.

version: 1
frozen_date: "2026-08-16"

thesis:
  primary: >
    An automatically constructed digital twin from a casual video/phone scan
    preserves enough of a manipulation scene's causal structure that a frozen
    policy's behavior in the twin predicts its behavior in the source
    environment, measured causally where ground truth is known and hidden
    from construction (oracle track) and as coverage/replay evidence where it
    is not (DROID track), with the twin's own certificate predicting where
    this correlation holds.
  fallback: >
    An automatically certified digital twin correctly abstains on
    constructions it cannot validate, and abstention/repair improves the
    accepted subset's agreement with oracle ground truth even when raw
    correlation is weak.

scope_decisions:
  - id: polaris_blocked
    statement: >
      PolaRiS source exists (third_party/PolaRiS) and its Python/CUDA-13
      dependency stack installs cleanly, but Isaac Sim 5.1.0's RTX renderer
      segfaults on this cluster's driver (595.x fleet-wide; needs 580.65.06,
      an upstream-confirmed incompatibility) whenever cameras are enabled --
      required by every real PolaRiS task. No software fix exists; a driver
      downgrade is outside this project's authority (shared infra, affects
      other users). mujoco_paired (built + smoke-verified on a real scene)
      is the permanent path for Tasks 07-08, not a placeholder.
    date: "2026-08-16"
  - id: no_real_robot
    statement: >
      No physical robot access ("we have no robot", docs/CONTRIBUTIONS.md).
      Task 18 dropped as a blocker; oracle_causal is the headline predictive
      track instead of a real-robot paired track.
    date: "2026-08-16"
  - id: phone_room_narrowed
    statement: >
      phone_deploy track reports whatever real capture count exists at
      freeze (n=1 today: pilot_a29cccc784), never generalized past n.
    date: "2026-08-16"

protocols:
  scannet_scale:
    question: "Does automatic factorization hold up at scale?"
    ground_truth: "ScanNet++ laser mesh + human instance labels"
    admissible_baselines: [maskclustering, flashsplat, simfoundry_repro]
    status: done_prior_paper
    primary_metric: null   # reused from construction paper, not re-litigated here
    secondary_metrics: []

  oracle_causal:
    question: "Does construction error causally predict policy behavior change?"
    ground_truth: "OmniGibson/BEHAVIOR-1K interactive scene state, hidden from reconstruction"
    admissible_baselines: [raw_reconstruction, legacy_support_shim]
    # simfoundry_repro is NOT admissible here (corrected 2026-08-30, see contract
    # doc changelog #9): s0_select_frame.py and s5_align.py both hard-depend on
    # C.load_gt_instances(), which only resolves ScanNet++-style segments.json/
    # segments_anno.json -- on BEHAVIOR scenes this either crashes outright, or
    # if ever pointed at a same-shaped GT file, would leak hidden oracle GT into
    # the baseline's frame selection. Admissible only in mujoco_paired below,
    # where the scenes really are ScanNet++.
    status: in_progress  # 6 scenes/4 families, fast-tier (18 combos) scored; deep-tier (real
                          # SAM3+TRELLIS+CoACD+gsplat) job hit TWO node-locality cache bugs in a
                          # row on H200/GCP nodes (SAM3 ckpt, then TRELLIS+dinov2 -- both cached
                          # under hala-local ~/.cache, invisible elsewhere); both fixed 2026-08-16
                          # by copying to ${HF_HOME} + ${TORCH_HOME}
                          # and exporting HF_HOME/TORCH_HOME in oracle_matrix.sbatch; verified via a
                          # standalone srun before resubmitting as job 708586. NOTE: the previously-
                          # cited "7/7 BDDL" number for behavior_task-0020 was found to be a general
                          # ablation, not attributable to this scene specifically (export_omnigibson.py
                          # globs *_factory dirs, which this scene's output dir isn't named as) -- do
                          # not cite it as oracle-track evidence until job 708586 produces a correctly-
                          # attributed number.
    task_list_ref: configs/oracle/tasks.yaml
    policy_list: [pi05_droid_jointpos, droid_pi05_jointpos_with_web_and_sim, scripted_sinusoid]  # status per robo/policy/registry.py: verified, verified (real 30-episode run 2026-08-16, 5/30 nonzero), verified(fixture)
    primary_metric: staged_progress_mae
    secondary_metrics: [spearman_task_difficulty, mmrv, calibration_brier, risk_coverage_auc]
    min_scenes: 6
    min_task_families: 2
    min_nondegenerate_pairs: 12
    go_no_go:
      staged_progress_mae_ci_upper_lt: 0.35
      spearman_ci_excludes_zero: true

  mujoco_paired:
    question: "Holding robot/policy/camera/control fixed, does construction method change outcome vs. a hand-built reference scene?"
    ground_truth: null
    admissible_baselines: [raw_reconstruction, legacy_support_shim, simfoundry_repro]
    # simfoundry_repro IS admissible here -- this track's scenes (c50d2d1d42 and
    # the other composite-eval-ready ScanNet++ scenes) are exactly the layout
    # its GT-dependent stages (s0_select_frame, s5_align) already support safely.
    status: in_progress  # 2026-08-31 FINAL CLEAN RUN (job 792587, after corrections
                          # #9-#12 -- regrounding, config paths, gripper clamp, read-only-array
                          # fix -- all resolved; this is the first run with zero infra bugs):
                          # pi05_droid_jointpos, frozen 32s horizon, 5 scenes x 3 conditions,
                          # n=26 episodes/condition.
                          #   simany:            mean 0.0385, 15.4% nonzero (4/26), 0 crashes
                          #   reference:         mean 0.0385, 15.4% nonzero (4/26), 0 crashes
                          #                      (IDENTICAL to simany -- real signal that this
                          #                      policy/task set doesn't discriminate construction
                          #                      quality at this n, not evidence of "no difference")
                          #   simfoundry_repro:  mean 0.0000, 0% nonzero (0/26), 8/26 env_crash
                          #                      (KeyError on obj_14/15/17, ValueError empty-seq --
                          #                      ALL are genuine unresolved objects per the
                          #                      regrounding report, i.e. SimFoundry-repro's
                          #                      single-frame discovery really didn't find them,
                          #                      not a lookup bug) -- coverage now 18/26 (69%),
                          #                      up from 12/26 (46%) pre-regrounding-fix.
                          # STILL DO NOT cite as a finding: n=26 remains far below the power
                          # analysis's ~60-158 episode floor (docs/ROBOT.md) for even a coarse
                          # effect. What IS defensible to state: (a) the pipeline now produces
                          # real, infra-clean comparable data across all three conditions: (b)
                          # simfoundry_repro's zero nonzero rate on its 18 valid episodes is
                          # suggestive but not statistically established at this n -- a
                          # larger-n rerun is needed before any comparative claim in the paper.
    policy_list: [pi05_droid_jointpos, droid_pi05_jointpos_with_web_and_sim]
    primary_metric: staged_progress_delta
    secondary_metrics: [pairwise_preference_accuracy]

  droid_replay:
    question: "Does the pipeline reconstruct real uncontrolled robot workspaces and align to real trajectories?"
    ground_truth: "DROID FK trajectory (replay agreement only, no autonomous success labels)"
    admissible_baselines: []
    status: in_progress  # crash root-caused+fixed 2026-08-16 (ffmpeg select-filter term limit
                          # + sbatch shebang); PennPAL clean at 0.59cm/3.1deg; CLVR correctly
                          # loud-failed the 10cm gate (legit rejection). Session-death cancelled
                          # IRIS/REAL/IPRL#2, resubmitted: IRIS+IPRL#2 COMPLETED (job 708434/708436),
                          # REAL hit a real zero-discovery crash in robo/sim/s7_sim.py
                          # (build_background .min() on an empty aabb list when SAM3 finds zero
                          # objects) -- fixed 2026-08-16 (fall back to the uncropped scene mesh)
                          # and resubmitted as job 709510. Current tally: 8/9 labs reconstructed
                          # end-to-end pending 709510 (IPRL/RAIL/AUTOLab/TRI/RPL/PennPAL/IRIS/IPRL#2).
    min_labs: 3
    min_workspaces: 10
    primary_metric: fk_alignment_residual_m
    secondary_metrics: [dynamic_contamination_fraction]

  phone_deploy:
    question: "What is capture-to-sim time/success on genuinely casual footage?"
    ground_truth: null
    admissible_baselines: []
    status: n_equals_1
    primary_metric: capture_to_build_success
    secondary_metrics: [wall_clock_seconds, certificate_coverage]

table_column_metric_map:
  # every planned table column must resolve to a key here or validation fails
  staged_progress_mae: oracle_causal
  spearman_task_difficulty: oracle_causal
  mmrv: oracle_causal
  calibration_brier: oracle_causal
  risk_coverage_auc: oracle_causal
  staged_progress_delta: mujoco_paired
  pairwise_preference_accuracy: mujoco_paired
  fk_alignment_residual_m: droid_replay
  dynamic_contamination_fraction: droid_replay
  capture_to_build_success: phone_deploy
  wall_clock_seconds: phone_deploy
  certificate_coverage: phone_deploy

gates:
  G1: "one phone/video scan reaches full-collision MuJoCo sim + deterministic smoke rollout"
  G2: "one hand-built reference task variant runs in MuJoCo with identical robot/camera/control/rubric contract vs the SimAny reconstruction"
  G3: "at least two verified policies + one scripted baseline yield non-degenerate matrices across >=6 oracle task instances"
  G4: "certificate improves risk-coverage on held-out oracle scenes vs every global single-metric baseline, or claim is narrowed"
  G5: "oracle track >=6 scenes / >=2 task families / >=1 degradation level; phone track reports true n honestly"
  G6: "every paper number generated from committed manifests, passes submission audit"

stop_condition: >
  If fewer than min_nondegenerate_pairs (12) exist in oracle_causal after
  build-out, report descriptive results only and narrow the primary thesis to
  the fallback thesis. Do not resample only favorable scenes. Do not drop
  pairs post-hoc to raise correlation.
