proposal_pool:
  membership_source: population.membership
  legacy_generation_provenance:
    artifact_bytes_hash_frozen: true
    original_generator_commits_recorded: false
    original_checkpoint_identities_recorded: false
    original_runtime_manifests_recorded: false
    generator_commit: null
    current_controller_commit_may_backfill_generator_commit: false
    claim_status: preliminary_only
  initial_registration:
    implementation: agents.assets.s5_align.align_object
    source_up_hypothesis: "+z"
    same_code_all_policies: true
  object_dir_template: outputs/{scene_id}_factory/objects/obj_{object_index:02d}
  proposals:
    trellis:
      tool_id: trellis
      expected_available: 457
      raw_mesh_path_template: outputs/{scene_id}_factory/objects/obj_{object_index:02d}/trellis/trellis_mesh.ply
      raw_gaussian_path_template: outputs/{scene_id}_factory/objects/obj_{object_index:02d}/trellis/trellis_gs.ply
    reconviagen:
      tool_id: reconviagen
      expected_available: 453
      expected_typed_unavailable: 4
      raw_mesh_path_template: outputs/{scene_id}_factory/objects/obj_{object_index:02d}/rvg/rvg_mesh.ply
      raw_gaussian_path_template: outputs/{scene_id}_factory/objects/obj_{object_index:02d}/rvg/rvg_gs.ply
      typed_unavailable_job_ids:
        - 27dd4da69e/obj_12
        - 3db0a1c8f3/obj_12
        - 3db0a1c8f3/obj_16
        - ac48a9b736/obj_02
  required_resolved_identity_fields: [path, size_bytes, sha256]
  raw_mesh_manifest_canonicalization:
    encoding: utf-8
    serialization: json
    document_shape: array
    sort_keys: true
    separators: [",", ":"]
    ensure_ascii: false
    terminal_newline: false
    one_manifest_per_tool: true
    path_base: repository_root
    path_style: relative_posix
    file_hash: sha256_raw_file_bytes
    file_size: stat_size_bytes
    tool_field_values: {trellis: trellis, reconviagen: reconviagen}
    row_fields: [job_id, tool, path, size_bytes, sha256]
    row_order: [job_id_utf8, tool_utf8]
  raw_mesh_snapshots:
    trellis:
      rows: 457
      total_size_bytes: 1744518721
      manifest_sha256: 433d4e60d0137840a64b4e999e7044d267f16dcfc597b122d7ca6aa1783c9f3c
    reconviagen:
      rows: 453
      total_size_bytes: 2395975348
      manifest_sha256: 2b501c1dec9242e08475023c28519f48edf56292999ff5dc5489d894f8c11965
  missing_initial_proposal_policy:
    emit_typed_unavailable_record: true
    keep_job_in_every_policy_denominator: true
    do_not_substitute_canonical_winner: true

# E2 already froze the source scene Gaussian and camera identities for all 50
# rooms.  E3 may read only these three identities from the manifests; this is
# not permission to read E2 evaluation images or scores.
observation_source:
  kind: e2_source_scene_and_camera_identity_manifest
  e2_freeze_id: icra2027-contract-v1-e2-2c7ed67df534-full
  manifest_path_template: outputs/icra2027/icra2027-contract-v1-e2-2c7ed67df534-full/fidelity/room_runs/{scene_id}/manifest.json
  manifest_fields:
    source_scene_gaussian: source_scene_gaussian
    camera_intrinsics: camera_artifacts.intrinsics
    camera_poses: camera_artifacts.poses
  expected_scenes: 50
  canonical_identity_fields:
    - scene_id
    - source_scene_gaussian.path
    - source_scene_gaussian.size_bytes
    - source_scene_gaussian.sha256
    - camera_intrinsics.path
    - camera_intrinsics.size_bytes
    - camera_intrinsics.sha256
    - camera_poses.path
    - camera_poses.size_bytes
    - camera_poses.sha256
  canonicalization:
    encoding: utf-8
    serialization: json
    sort_keys: true
    separators: [",", ":"]
    ensure_ascii: false
    row_order: [scene_id_utf8]
  canonical_identity_manifest_sha256: 43ec6446eb52951f7d73fab4600ea33e72b5a0e9713530863ad07a881d7ed9b7
  component_manifest_sha256:
    source_scene_gaussian: 4b92802c1a094ce2b25e0a06591265b8a71853c34a91e20837576ddae1f5cb8b
    camera_intrinsics: df7b1fc1cb0550752985eb8a6beff13ec2b63e686861d4c61c07dcdc79c8a10a
    camera_poses: 5e5759ebb0241e528e45a1d1af81672e101ca8ad04692bb1d1bdc92891f8bd7b
  controller_receives:
    representation: nested_under_resolved_jobs_scenes
    scene_source_keys: [scene_id, source_scene_gaussian, camera_artifacts]
    source_scene_gaussian_identity_keys: [path, size_bytes, sha256]
    camera_artifacts_keys: [intrinsics, poses]
    camera_identity_keys: [path, size_bytes, sha256]
  controller_forbidden_manifest_fields: [gt, source_images, eval_frames, methods]

observation_protocol:
  render_mode: RGB+ED
  rendered_rgb: discarded
  rendered_channels_used: [expected_depth, gaussian_alpha]
  crop_channel_used: rgba_alpha_only
  rgba_alpha_threshold_inclusive_uint8: 128
  gaussian_alpha_threshold_inclusive: 0.60
  depth_range_m_inclusive: [0.05, 8.0]
  pixel_center_offset: 0.5
  camera_pose_input_convention: colmap_world_to_camera
  camera_to_world_conversion: matrix_inverse
  output_coordinate_frame: world
  output_dtype: float32
  output_unit: metre
  forbidden_render_inputs: [rendered_rgb, evaluation_image, evaluation_mask, evaluation_geometry]

controller_input_boundary:
  sanitized_job_manifest: outputs/icra2027/{freeze_id}/agentic/input_inventory/resolved_jobs.json
  sanitized_proposal_manifest: outputs/icra2027/{freeze_id}/agentic/input_inventory/resolved_proposals.json
  exact_sanitized_schemas:
    resolved_jobs:
      top_level_keys: [schema_version, freeze_id, study_scope, counts, source_contract, observation_protocol, scenes]
      counts_keys: [scenes, jobs, policy_object_rows]
      source_contract_keys: [jobs_sha256, jobs_hash_method, contract_sha256, contract_hash_method, contract_freeze_id, code_commit]
      scene_keys: [scene_id, source_scene_gaussian, camera_artifacts, jobs]
      source_identity_keys: [path, size_bytes, sha256]
      camera_artifacts_keys: [intrinsics, poses]
      camera_identity_keys: [path, size_bytes, sha256]
      job_keys: [freeze_id, job_id, scene_id, object_slot, artifact_paths, artifact_hashes, construction_evidence]
      job_artifact_paths_keys: [rgba]
      job_artifact_hashes_keys: [rgba]
      job_construction_evidence_keys: [source_frame, bbox_px, legacy_mask_provenance]
    resolved_proposals:
      top_level_keys: [schema_version, freeze_id, counts, proposals]
      counts_keys: [jobs, trellis_available, reconviagen_available, reconviagen_typed_unavailable]
      proposal_keys: [freeze_id, job_id, scene_id, object_slot, proposal_id, tool_id, availability, artifact_paths, artifact_hashes, artifact_sizes, construction_evidence, raw_generator_provenance]
      available_artifact_paths_keys: [raw_mesh, raw_gaussian]
      available_artifact_hashes_keys: [raw_mesh, raw_gaussian]
      available_artifact_sizes_keys: [raw_mesh, raw_gaussian]
      available_construction_evidence_keys: []
      typed_unavailable_artifact_paths_keys: []
      typed_unavailable_artifact_hashes_keys: []
      typed_unavailable_artifact_sizes_keys: []
      typed_unavailable_construction_evidence_keys: [typed_failure, missing_artifacts]
      raw_generator_provenance_keys: [artifact_bytes_hash_frozen, generator_commit, checkpoint_identity_recorded, runtime_manifest_recorded, claim_status]
  reject_unknown_keys: true
  forbidden_paths_or_patterns:
    - "**/gt_points.ply"
    - "**/report.json"
    - "**/aligned.json"
    - "**/aligned_all*.json"
    - "**/rvg_eval.json"
    - "**/hybrid.json"
    - "**/hybrid_all.json"
    - "**/eval_vs_gt.json"
  forbidden_fields:
    - gt_object_id
    - evaluation_ground_truth_geometry
    - eval
    - f1
    - f1_20
    - f1_40
    - chamfer_med_m
    - tier
    - rejected
    - winner
    - canonical_source
  fail_on_forbidden_path_or_field: true

legacy_crop_provenance:
  total_jobs: 457
  sam3_masks_selected_by_overlap_with_gt_projection: 386
  gt_projected_mask_fallbacks: 71
  sum_must_equal_total: true
  claim_scope: controller_gt_isolated_not_gt_free_discovery
  controller_may_read_mask_source: false

smoke:
  artifact_mode: cached_or_synthetic
  maximum_runtime_seconds: 300
  object_scenarios:
    - {id: both_initial_valid, expected_actions_include: [accept]}
    - {id: multiview_collapse, expected_actions_include: [accept]}
    - {id: retry_abstains, expected_actions_include: [accept, retry, abstain]}
  contract_scenarios:
    - {id: hard_export_impossible, initial_proposal_pool: empty, expected_actions_include: [reject, abstain]}
  require_actions_observed: [accept, retry, reject, abstain]

required_outputs:
  - job_ledger.jsonl
  - selected_assets/{policy_id}/{scene_id}/{object_slot}.json
  - agentic_ablation.csv
  - agentic_ablation.json
  - coverage_fidelity_curve.csv
  - retry_breakdown.csv
  - failure_transitions.csv
