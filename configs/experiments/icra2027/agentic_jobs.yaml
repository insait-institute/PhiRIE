# E3 controller-GT-isolated conditional construction population.
#
# This file freezes membership from the pre-existing GT-factory reports in an
# inventory step that runs before the controller.  The controller receives only
# opaque job IDs, raw proposal identities, and newly produced construction-time
# evidence.  It must never receive the report rows or the legacy alignment /
# hybrid scores used to define and audit this conditional population.
schema_version: 1
freeze_id: inherit
study_scope: conditional_fixed_gt_factory_jobs
paper_ready: false
paper_ready_reason: >-
  Development/preliminary E3 contract. Population membership is conditioned on
  the legacy GT-factory accepted set, the legacy crop masks are not GT-free,
  and the cached proposal pool lacks original generator/checkpoint/runtime
  provenance. A provenance-complete proposal pool and paper-mode E0 contract
  are still required before a title claim.

output_dir: outputs/icra2027/{freeze_id}/agentic

population:
  dataset: scannetpp_v2
  split: nvs_sem_val
  scene_roster_config: configs/experiments/icra2027/construction_regimes.yaml
  scene_roster_config_file_sha256: 3bf4da5aa0e6fbb3d044a9e9050174332438e82dcd96a30de86c2d497085517e
  scene_roster_sha256: 7002a3dd0263ff6fb6895f8a4d424a790c3f6fc125fc682517c328cbee723913
  scene_roster_hash_method:
    normalize_each_scene_id_to_string: true
    sort: utf8_ascending
    serialization: newline_delimited
    final_newline: true
    encoding: utf-8
  planned_scenes: 50
  planned_jobs_per_policy: 457
  policy_ids: [A0, A1, A2, A3, A4]
  planned_policy_object_rows: 2285
  preserve_empty_scenes: true
  preserve_failed_jobs: true
  membership:
    authority: factory_report_json
    report_path_template: outputs/{scene_id}_factory/report.json
    object_rows_path: objects
    object_index_field: index
    inventory_only_fields: [index, gt_object_id, label, tier, rejected]
    include_when:
      tier_in: [A, B]
      rejected_is_null: true
    sort_by: [scene_id_utf8, object_index_integer]
    job_id_format: "{scene_id}/obj_{object_index:02d}"
    resolved_roster_sha256: 80da773ab053f6277cd228553840234c82dc18906d547786c290c6cadbe7c786
    resolved_roster_canonicalization:
      encoding: utf-8
      serialization: json
      sort_keys: true
      separators: [",", ":"]
      ensure_ascii: false
      row_fields: [scene_id, object_index, gt_object_id, label, rvg_complete]
      row_order: [scene_id_utf8, object_index_integer]
    forbidden_membership_sources:
      - outputs/{scene_id}_factory/objects/hybrid_all.json
      - directory_glob
      - successful_jobs_only
    controller_receives_report_fields: false

  # This is a strict inventory cross-check, never a controller input.  The file
  # is a top-level list with one row per original object, keyed by `index`.
  prehybrid_cross_check:
    path_template: outputs/{scene_id}_factory/objects/aligned_all_prehybrid.json
    root_type: list
    index_field: index
    expected_rows_all_scenes: 789
    controller_access: forbidden

  # Each report hash freezes the exact source used by the membership resolver.
  # accepted_jobs and reconviagen_available must sum to 457 and 453.
  scene_snapshots:
    - {scene_id: "09c1414f1b", report_sha256: "24a0cb64c531d42e72d83d61bb2365c9bf0f8c68428243dfb8ef0be0269b32a7", accepted_jobs: 27, reconviagen_available: 27}
    - {scene_id: "0d2ee665be", report_sha256: "f9596dc88d5e636d38b7cdbe1e959a65775cf602f4fdd829b1cfe0255d84e571", accepted_jobs: 19, reconviagen_available: 19}
