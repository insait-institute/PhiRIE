# Root provenance index for the ICRA 2027 experiment suite.
# Values set to "auto" are resolved and pinned by robo.eval.freeze.
schema_version: 1
mode: smoke
freeze_id: icra2027-contract-v1
code_commit: auto
git_dirty: false
created_utc: auto
paper_repository: ../SimAnyRoom
paper_commit_before_update: auto

input_roots:
  - id: frozen_fields
    path: configs/experiments/frozen_fields.yaml
    kind: metadata
    required: true
  - id: frozen_fields_lock
    path: configs/experiments/.frozen_fields.lock.json
    kind: metadata
    required: true
  - id: agentic_jobs
    path: configs/experiments/icra2027/agentic_jobs.yaml
    kind: experiment_config
    required: true
  - id: agentic_policies
    path: configs/experiments/icra2027/agentic_policies.yaml
    kind: experiment_config
    required: true

# Paper freezes must replace this empty list with the real, immutable policy
# and Harmonizer checkpoints and set mode: paper. Smoke freezes deliberately
# contain no pretend model hashes.
checkpoint_roots: []

hardware:
  accelerator: cpu
  gpu_required: false
  purpose: contract preflight only

construction_config: configs/experiments/icra2027/construction_regimes.yaml
fidelity_manifest: configs/experiments/icra2027/fidelity_manifest.json
harness_config: configs/experiments/icra2027/harness.yaml
audit_config: configs/experiments/icra2027/audit.yaml
harmony_manifest: configs/experiments/icra2027/harmony_visual_manifest.json
real_world_config: configs/experiments/icra2027/real_world.yaml
