claim_decisions:
  AGENTIC_TITLE_CLAIM:
    required_experiment: E3
    required_gate: admissible full fixed-cohort coverage/fidelity comparison
    status: NOT_RUN
    decision: remove
    observed_result: The authenticated automatic-discovery pilot passes integrity checks; the full fixed cohort
      and downstream comparisons are not complete.
    enabled_sentence: An independently evaluated automatic-discovery case study examines evidence selection,
      registration retries, and abstention; it does not establish room-scale or downstream manipulation gains.
    removed_sentence: Its legacy object population uses GT-assisted preparation and has incomplete generator
      provenance; it does not establish automatic-construction or downstream manipulation gains.
    paper_file: paper_sections/01_abstract_intro.tex
  MANIPULATION_CLAIM:
    required_experiment: E4
    required_gate: complete paired treatment ledger
    status: NOT_RUN
    decision: remove
    observed_result: Required task/treatment matrix is incomplete.
    enabled_sentence: Construction, collision, and observation improvements are not claimed.
  HARMONIZER_MAIN_CLAIM:
    required_experiment: E5
    required_gate: preservation and paired manipulation
    status: NOT_RUN
    decision: remove
    observed_result: Real checkpoint access is gated; no complete visual/policy comparison.
    enabled_sentence: Harmonizer likewise has no admissible full visual comparison in this report.
  TASK_SUPPORT_CLAIM:
    required_experiment: E6
    required_gate: held-out selective risk
    status: NOT_RUN
    decision: remove
    observed_result: No admissible held-out query cohort and six-method LOSO result.
    enabled_sentence: Smoke or scripted-policy outputs are engineering checks rather than evidence for those
      claims.
  SIM_REAL_CLAIM:
    required_experiment: E8
    required_gate: matched autonomous physical trials
    status: NOT_RUN
    decision: remove
    observed_result: No matched autonomous physical trial cohort is available.
    enabled_sentence: No matched autonomous physical trial cohort is available, so physical success, sim--real
      gap, and real-world predictivity are not reported.
  RAW_ROOM_APPEARANCE_CLAIM:
    required_experiment: E2
    required_gate: authenticated complete raw-room held-out view roster
    status: PASS
    decision: narrow
    observed_result: The completion receipt and coverage manifest bind the populated raw input-Gaussian row;
      all other declared conditions remain unmeasured.
    enabled_sentence: The held-out room table reports the raw input Gaussian only, with pinned metric implementations
      and original render provenance.
    removed_sentence: The three populated room conditions use identical scene and camera populations.
    paper_file: paper_sections/04_results.tex
  FACTORIZED_APPEARANCE_CLAIM:
    required_experiment: E2
    required_gate: matched complete factorized-composite comparison
    status: NOT_RUN
    decision: remove
    observed_result: Full method matrix remains incomplete. A separate fixed common-view pilot has no observed
      appearance improvement.
    enabled_sentence: Factorized-composite and Harmonizer comparisons remain unmeasured in this source.
    removed_sentence: The input Gaussian reconstruction remains stronger than either factorized composite;
      automatic discovery has an additional appearance cost.
    paper_file: paper_sections/04_results.tex
  INDEPENDENT_OBJECT_GEOMETRY_SCOPE:
    required_experiment: E2/E3
    required_gate: keep unmeasured E2 roster distinct from matched E3 case-study geometry
    status: PASS
    decision: narrow
    observed_result: The E2 object-method table is unmeasured; the independent E3 evaluation preserves unmatched
      jobs as null geometry.
    enabled_sentence: The declared E2 object-method comparison remains unmeasured; the separate E3 case study
      reports geometry only for independently matched jobs.
    removed_sentence: Leak-free masked object views and registration-independent evaluation surfaces are not
      yet available.
    paper_file: paper_sections/04_results.tex
  E3_MATCHED_CASE_STUDY:
    required_experiment: E3
    required_gate: authenticated training-only construction and independent evaluation with explicit matched
      denominators
    status: PASS
    decision: narrow
    observed_result: The independent completion audit authenticates the source and replay; A4 geometry is conditioned
      on a smaller accepted and matched subset.
    enabled_sentence: The table reports matched-geometry counts separately from accepted jobs; A4 changes the
      evaluated subset, so conditional quality is not a matched-cohort improvement claim.
    removed_sentence: A4 trades away coverage for stronger conditional quality.
    paper_file: paper_sections/04_results.tex
  E3_UPSTREAM_PROVENANCE:
    required_experiment: E3
    required_gate: authenticated initial-pool and construction/evaluation separation audit
    status: PASS
    decision: narrow
    observed_result: The new completion audit replaces the legacy GT-assisted source without relabeling or
      modifying either frozen output.
    enabled_sentence: The case study uses automatic discovery and training-only construction inputs; independent
      GT is used only after the controller output is frozen.
    removed_sentence: This is a conditional study of legacy factory-selected objects. Their crops used GT-assisted
      mask selection or projection, although the runtime controller is isolated from evaluation GT. Original
      generator commits, checkpoints, and runtime manifests are missing, and thresholds retain preliminary
      status.
    paper_file: paper_sections/04_results.tex
  E3_RUNTIME_CLAIM:
    required_experiment: E3
    required_gate: complete upstream process and registration/retry runtime accounting
    status: NOT_RUN
    decision: remove
    observed_result: The pilot runtime field excludes upstream cached generation and is omitted from the displayed
      table.
    enabled_sentence: Runtime is omitted because the pilot aggregate accounts for registration and physical
      probes but excludes upstream generation costs.
    removed_sentence: A3 improves full-coverage geometry and the physical probe relative to A2, with higher
      runtime.
    paper_file: paper_sections/04_results.tex
  REAL_CAPTURE_CLAIM:
    required_experiment: E7
    required_gate: complete prospective construction cohort and independent alignment
    status: NOT_RUN
    decision: narrow
    observed_result: The original ten-workspace CPU cohort is complete and independently authenticated; held-out
      errors and unavailable constructions remain visible. Gaussian and complete simulator construction are
      separate unfinished stages.
    enabled_sentence: The prospective DROID cohort reports independent kinematic alignment after TRAIN-only
      fitting; complete real-capture simulator construction remains unvalidated.
    removed_sentence: Real-capture construction and independent alignment remain prospective experiments.
    paper_file: paper_sections/04_results.tex
  T2_MESH_PILOT_SCOPE:
    required_experiment: E2/TRELLIS.2 engineering pilot
    required_gate: 'PASS: authenticated sealed mesh-only geometry integrity with unchanged matched and planned
      populations'
    status: PASS
    decision: narrow
    observed_result: The sealed pilot and independent output audit pass integrity checks; unmatched jobs remain
      null and native Gaussian/full-twin/headline flags remain false.
    enabled_sentence: The separate mesh-only pilot retains unmatched jobs and does not establish an improvement
      in geometry, appearance, or manipulation.
    removed_sentence: ''
    paper_file: paper_sections/04_results.tex
  E4_COMPACT_APPLICABILITY:
    required_experiment: E4 compact engineering matrix
    required_gate: PASS planning applicability and an eligible policy rollout; observed applicability gate
      is FAIL
    status: FAIL
    decision: narrow
    observed_result: Coverage integrity passes; planning applicability fails, no fixed cell is eligible for
      policy rollout, and policy execution remains NOT_RUN with null success.
    enabled_sentence: The fixed compact manipulation matrix has no eligible policy rollout; prerequisite failures
      remain in the planned denominator.
    removed_sentence: ''
    paper_file: paper_sections/04_results.tex
  DROID_CPU_ALIGNMENT_SCOPE:
    required_experiment: E7 prospective CPU alignment stage
    required_gate: PASS original complete ten-workspace publication, TRAIN/reference separation and source
      integrity
    status: PASS
    decision: narrow
    observed_result: Complete CPU stage records preserve all fixed workspaces and the original held-out errors,
      including catastrophic failures; CPU completion is not a full simulator build.
    enabled_sentence: All declared workspaces remain in the CPU-stage table; errors are conditional on the
      available held-out reference frames, and failed constructions retain missing measurements.
    removed_sentence: ''
    paper_file: paper_sections/04_results.tex
  DROID_PUBLIC_STAGE_SCOPE:
    required_experiment: E7 Gaussian and public construction stages
    required_gate: Complete original ten-workspace stage audits and source integrity
    status: PASS
    decision: narrow
    observed_result: All original workspaces remain; empty reconstructions, zero discoveries and unavailable
      counts are retained. Prepared proposals are not accepted simulator assets.
    enabled_sentence: The continuation reports Gaussian training and prepared automatic proposals, retaining
      empty reconstruction and zero-discovery outcomes; it does not establish complete simulators.
    removed_sentence: ''
    paper_file: paper_sections/04_results.tex
  COMMON_VIEW_DIAGNOSTIC:
    required_experiment: E2
    required_gate: authenticated predeclared common cameras with original coverage
    status: PASS
    decision: narrow
    observed_result: Common-camera pilot completed; composite means are slightly worse on all three image metrics.
      One scene cannot establish population improvement.
    enabled_sentence: The separate fixed common-view diagnostic retains the original planned-view denominator
      and uses identical TEST cameras for both quality rows; it does not establish a population-level improvement.
    paper_file: paper_sections/04_results.tex
