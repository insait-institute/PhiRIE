    paper_file: paper_sections/04_results.tex
  FULL_QUALIFICATION_APPLICABILITY:
    required_experiment: E4
    required_gate: Qualified prerequisites before real policy rollout
    status: FAIL
    decision: narrow
    observed_result: 2690logical cells;1670prerequisite FAIL1020source unavailable NOT_RUN;0simulated checks0policy;success
