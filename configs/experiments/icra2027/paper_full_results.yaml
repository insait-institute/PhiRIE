    enabled_sentence: The full prerequisite audit yields no qualified task; failed checks and source-unavailable
      cells remain separate, with no policy rollout or measured success rate.
    paper_file: paper_sections/04_results.tex
  FULL_EXPORT_DROP_SCOPE:
    required_experiment: E1
    required_gate: Authenticated export/drop stage; do not promote missing geometry/runtime
    status: PASS
    decision: narrow
    observed_result: 50scenes1871inputs399controller accepted394exported361/394independent isolated stable;
