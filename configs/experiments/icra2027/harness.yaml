schema_version: 1
paper_mode: false
out_dir: outputs/icra2027/{freeze_id}/manipulation

# One global block is inherited byte-for-byte by every treatment. Paper runs
# replace only the policy/checkpoint and reset list before freezing.
contract:
  policy:
    id: scripted_sinusoid
    kind: scripted_smoke
    checkpoint_hash: null
    checkpoint_hash_kind: not_applicable
  robot:
    arm: panda_nohand
    gripper: robotiq_2f85
    reset_pose_rad: [0, -0.6283185307, 0, -2.5132741229, 0, 1.8849555922, 0]
  cameras:
    exterior: left-ZED-equivalent
    wrist: wrist_image_left
    resolution: [640, 360]
  action_convention: absolute_joint_position
  controller:
    physics_dt: 0.0016666667
    substeps_per_tick: 40
    action_dim: 8
    gripper_binarize_threshold: 0.5
    per_tick_joint_delta_clamp_rad: 0.2
  control_rate_hz: 15
  horizon_s: 32
  task_instruction: smoke manipulation contract
  rubric:
    stages: [grasp, lift, hover, place]
    credit_per_stage: 0.25
    success_definition: place held for 1.0s
  reset_ids: [smoke_0, smoke_1, smoke_2]

treatments:
  - id: box_proxy_raster
    scene: box_proxy
    collision: full_room
    observation: raster
    options: {label: Primitive box proxy + raster}
  - id: simany_raster
    scene: simany
    collision: full_room
    observation: raster
    options: {label: Factorized SimAny twin + raster}
  - id: shims_raster
    scene: simany
    collision: private_shims
    observation: raster
    options: {label: Private support shims + raster}
  - id: simany_raw
    scene: simany
    collision: full_room
    observation: composite_raw
    options: {label: Raw photoreal composite}
  - id: simany_harmony_c
    scene: simany
    collision: full_room
    observation: harmonizer_c
    options:
      label: Harmonizer + robot restoration (C)
      enhancer:
        backend: identity
        allow_smoke_only: true

comparisons:
  - id: scene_construction
    axis: scene
    baseline: box_proxy_raster
    treatments: [box_proxy_raster, simany_raster]
  - id: collision
    axis: collision
    baseline: shims_raster
    treatments: [shims_raster, simany_raster]
  - id: policy_observation
    axis: observation
    baseline: simany_raster
    treatments: [simany_raster, simany_raw, simany_harmony_c]
