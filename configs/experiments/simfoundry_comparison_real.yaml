# Real mujoco_paired benchmark: simany vs reference vs simfoundry_repro,
# with the verified pi05_droid_jointpos checkpoint at the frozen 32s horizon
# (configs/experiments/frozen_fields.yaml default -- horizon_s omitted here
# on purpose so it is NOT the smoke-test override). Same 5 scenes as the
# scripted smoke run (configs/experiments/simfoundry_comparison.yaml),
# which already validated the plumbing end to end. simfoundry_repro's
# object-index mismatch vs simany (independent discovery order) is a KNOWN
# real limitation -- episodes affected surface as env_crash and are
# reported honestly as coverage loss, not filtered out or resampled.
policy: pi05_droid_jointpos
seeds: [0, 1]
episodes: 1
jitter: 0.02
variant: default
video: false
render_wh: [640, 360]
policy_timeout_s: 60.0
conditions: [simany, reference, simfoundry_repro]

scenes:
  - id: 45b0dac5e3_factory
    factory_dir: ${SIMANY_ROOT}/outputs/45b0dac5e3_factory
    tasks_json: ${SIMANY_ROOT}/outputs/45b0dac5e3_factory/sim_export/pi05_tasks.json
  - id: 578511c8a9_factory
    factory_dir: ${SIMANY_ROOT}/outputs/578511c8a9_factory
    tasks_json: ${SIMANY_ROOT}/outputs/578511c8a9_factory/sim_export/pi05_tasks.json
  - id: 7b6477cb95_factory
    factory_dir: ${SIMANY_ROOT}/outputs/7b6477cb95_factory
    tasks_json: ${SIMANY_ROOT}/outputs/7b6477cb95_factory/sim_export/pi05_tasks.json
  - id: 825d228aec_factory
    factory_dir: ${SIMANY_ROOT}/outputs/825d228aec_factory
    tasks_json: ${SIMANY_ROOT}/outputs/825d228aec_factory/sim_export/pi05_tasks.json
  - id: c50d2d1d42_factory
    factory_dir: ${SIMANY_ROOT}/outputs/c50d2d1d42_factory
    tasks_json: ${SIMANY_ROOT}/outputs/c50d2d1d42_factory/sim_export/pi05_tasks.json

out_dir: ${SIMANY_ROOT}/outputs/paired_runs/simfoundry_comparison_real
