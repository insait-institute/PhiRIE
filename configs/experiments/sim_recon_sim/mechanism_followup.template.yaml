# Copy outside tracked source or commit the resolved file before preparing.
# Every REPLACE path is an input lookup, not a request to implement missing code.
schema_version: 1
protocol: native_mechanism_followup_v1
execution_ready: false
cohort_id: native-mechanism-followup-20260907-v1
methods: [REF_NATIVE, B0_FIXED_NATIVE, B1_FIXED_PRIORITY, B2_EVIDENCE, B3_AGENT_NATIVE]

# Point to the EXACT completed original L0 TEST roster, not scope/DEV outputs.
source_planned_units: /REPLACE/original_primary/planned_units.jsonl
# N1 acquisition binding roster containing bundle_dir, capture_public and capture_manifest_sha256.
source_bindings: /REPLACE/original_primary/bindings.jsonl
# Exact B0/B3 native execution binding files. Never point at all historical versions.
source_build_bindings:
  - /REPLACE/original_primary/build_bindings.jsonl
# One current canonical target pool per instance. No L1 destination pools.
candidate_pool_roots:
  - /REPLACE/frozen_test_shared_candidates
# Reuse the successful native engine admission for the unchanged policy/runtime.
engine_admission: /REPLACE/per_canonical_engine/admission.json

native_python: ${SIMANY_ROOT}/worktrees/sr0-native/.venv-native/bin/python
# Prefer a detached clean worktree at the final reviewed code commit.
worker_source: /REPLACE/clean_PhiRoom_worktree

# Inspect the account/partition before enabling. Ordinary one-instance jobs only.
sbatch_args:
  - --nodes=1
  - --ntasks=1
  - --cpus-per-task=8
  - --mem=48G
  - --gres=gpu:1
  - --time=04:00:00
  # Add the permitted --partition=... / --account=... / hardware constraint.
