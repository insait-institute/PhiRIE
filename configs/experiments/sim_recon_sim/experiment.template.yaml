# PLANNING TEMPLATE ONLY. This is NOT accepted by the existing harness schema.
# SR0/SR6 must resolve pins/IDs and implement/validate the native-adapter schema.
plan_schema_version: 1
execution_ready: false
track: sim_recon_sim
created_date: '2026-09-06'
code_baseline: 5bcc6565a55346247f1d8761392a5fe71102c176
new_stage_id: null
backend: robocasa_native

platform_lock:
  robocasa_commit: null
  robosuite_commit: null
  mujoco_version: null
  dataset_release: null
  asset_manifest_sha256: null
  native_horizon_source: null
  controller_config_sha256: null
  robot_asset_sha256: null
  renderer_hardware: null

policy_lock:
  kind: closed_loop_visual_policy
  name: null
  code_commit: null
  checkpoint_sha256: null
  configuration_sha256: null
  normalization_sha256: null
  native_robot: null
  image_keys: []
  proprioception_keys: []
  action_convention: null
  action_chunking: null
  grasping_mode: null
  oracle_object_state_observation: false

capture:
  sensor_regime: ideal_rgbd_posed
  allowed_public: [train_rgb, train_camera_K, train_camera_pose, train_depth, known_robot_config, public_task_instruction]
  prohibited_public: [native_object_ids, native_meshes, native_collision, native_object_poses, native_physics_parameters, instance_segmentation, heldout_views, reference_outcomes]
  rgb_only_requires_no_depth_initialization: true
  static_canonical_capture: true
  mix_episodes_with_different_object_states: false
  resolution_wh: [1280, 720]
  train_views: 120
  dev_views: 20
  test_views: 40
  camera_pose_convention: T_world_from_camera_opencv
  depth_units: meters
  depth_semantics: camera_z
  public_root: null
  private_reference_vault: null
  access_isolation_validated: false

rosters:
  # Empty by design: discover real native task and instance IDs, do not invent them.
  development_instances: []
  test_instances: []
  split_asset_overlap_report: null
  original_reference_eligibility_manifest: null
  freeze_before_reconstruction_test_metrics: true
  capability_scope: rigid_full_native_tasks
  excluded_before_test: [articulation_required, fluids, cloth, thermal, irreversible_material_transitions]

budgets:
  development: {scenes: 2, tasks_per_scene: 2, resets_per_task: 5}
  robocasa_test: {scenes: 8, tasks_per_scene: 2, resets_per_task: 20}
  core_policy_arms: 5
  planned_core_policy_episodes: 1600
  replay_arms: 6
  planned_replay_traces: 1920
  optional_extra_policy_episodes_per_arm: 320
  behavior_extension: {scenes: 4, tasks_per_scene: 2, resets_per_task: 10, arms: 2, episodes: 160}
  second_policy: optional_separate_complete_block
  counts_are_design_budgets_not_results: true

reset:
  mode: paired_world_perturbation_preserve_estimated_pose
  overwrite_reconstructed_pose_with_reference: false
  bank_path: null
  perturbation_config: null
  initial_and_post_settle_state_recorded: true
  online_object_sampling: false
  policy_rng_key_fields: [scene_id, task_id, reset_id, action_chunk_index]
  warmup_rng_separate: true

construction:
  initial_pool: [trellis, reconviagen]
  reuse_initial_proposals_by_hash: true
  b0: fixed_trellis
  b1: fixed_priority
  b2: evidence_selection
  b3: evidence_selection_registration_retry
  v1: b3_room_verification_abstain_no_repair
  b4: b3_task_conditioned_verification_bounded_repair
  bm: b3_fixed_order_same_extra_action_bank_and_maximum_budget
  additional_repair_actions_max: 2
  verification_config: null
  action_bank_config: null
  physics_prior_config: null
  replacement_scope: null  # target_only / target_and_receptacle / task_workspace / full_room
  retained_native_entities_manifest: null

treatments:
  core:
    - {id: REF_NATIVE, method: reference, physics: original, observation: native}
    - {id: FIXED_NATIVE, method: b0, physics: reconstructed, observation: native}
    - {id: AGENT_NATIVE, method: b3, physics: reconstructed, observation: native}
    - {id: ROOM_REPAIR_NATIVE, method: b4, physics: reconstructed, observation: native}
    - {id: ROOM_REPAIR_GS, method: b4, physics: reconstructed, observation: gaussian}
  optional:
    - {id: REF_GS_DIAGNOSTIC, method: b4_visual_only, physics: original, observation: gaussian_reference_pose_controlled, privileged: true}
    - {id: ROOM_REPAIR_HC, method: b4, physics: reconstructed, observation: harmonizer_robot_restore_c}
  replay_methods: [reference, b0, b3, v1, b4, bm]
  joint_system_contrast: [REF_NATIVE, ROOM_REPAIR_GS]
  construction_contrast: [FIXED_NATIVE, AGENT_NATIVE, ROOM_REPAIR_NATIVE]
  observation_contrast: [ROOM_REPAIR_NATIVE, ROOM_REPAIR_GS]
  optional_enhancement_contrast: [ROOM_REPAIR_GS, ROOM_REPAIR_HC]

metrics:
  room: [psnr_db, ssim, lpips_alex]
  geometry: [cd_cm_unsquared_symmetric_mean, f1_at_20mm]
  surface_samples_per_object: 20000
  surface_sample_seed: 42
  posthoc_gt_icp_for_headline: false
  replay: [position_rmse_cm, rotation_error_deg, final_position_error_cm, native_task_success]
  policy: [rollout_coverage, native_success_per_planned, native_success_per_executed, absolute_gap_percentage_points]
  primary_policy_aggregation: task_instance_macro
  bootstrap: {draws: 2000, seed: 42, clusters: [scene, task_instance, matched_reset]}
  missing_value: null
  return_missing_status_and_denominator: true

scheduling:
  slurm_arrays: false
  independent_jobs: true
  mutate_existing_freeze: false
  persistent_policy_service: true
  block_native_on_harmonizer: false
  core_full_requires_identity_and_development_pilot: true
  paper_numbers_hand_edited: false
