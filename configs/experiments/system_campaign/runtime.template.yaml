execution_ready: false
source_root: /RESOLVE/clean-PhiRoom-worktree
max_active_jobs: 4
# Reuse model-specific environments. Never pip-upgrade the existing robot environment.
# Allocate a compatible renderer GPU and source the existing verified EGL setup.
environments:
  gaussian:
    python: /RESOLVE/gaussian-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=96G, --gres=gpu:1, '--time=06:00:00']
  native:
    python: ${SIMANY_ROOT}/worktrees/sr0-native/.venv-native/bin/python
    admission: {path: /RESOLVE/native-admission.json, sha256: RESOLVE}
    setup_script: {path: /RESOLVE/run/roundtrip/native_env.sh, sha256: RESOLVE}
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=48G, --gres=gpu:1, '--time=04:00:00']
  trellis:
    python: /RESOLVE/trellis-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=64G, --gres=gpu:1, '--time=02:00:00']
  trellis2:
    python: /RESOLVE/trellis2-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=96G, --gres=gpu:1, '--time=02:00:00']
  reconviagen:
    python: /RESOLVE/rvg-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=64G, --gres=gpu:1, '--time=02:00:00']
  image_edit:
    python: /RESOLVE/qwen-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=128G, --gres=gpu:1, '--time=02:00:00']
  chorus:
    python: /RESOLVE/chorus-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=96G, --gres=gpu:1, '--time=02:00:00']
  harmonizer:
    python: /RESOLVE/harmonizer-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=64G, --gres=gpu:1, '--time=02:00:00']
  simfoundry:
    python: /RESOLVE/simfoundry-driver-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=96G, --gres=gpu:1, '--time=04:00:00']
  polaris:
    python: /RESOLVE/polaris-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=8, --mem=64G, --gres=gpu:1, '--time=04:00:00']
  api:
    python: /RESOLVE/api-driver-env/bin/python
    sbatch_args: [--nodes=1, --ntasks=1, --cpus-per-task=2, --mem=4G, '--time=01:00:00']
