# Canonical paper harness. Copy to harness_paper.yaml and replace only paths.
out_dir: outputs/harness_runs/paper_main
policy: pi05_droid
checkpoint_path: /ABSOLUTE/PATH/TO/POLICY_CHECKPOINT
host: localhost
port: 8000
seeds: [0, 1, 2, 3, 4]
episodes: 10
horizon_s: 60
jitter: 0.02
video: false
variant: default

scenes:
  - id: REPLACE_SCENE_ID
    factory_dir: outputs/REPLACE_SCENE_ID_factory
    tasks_json: outputs/REPLACE_SCENE_ID_factory/sim_export/pi05_tasks.json
    collision_variants:
      private_shims:
        tasks_json: outputs/REPLACE_SCENE_ID_factory/sim_export/pi05_tasks_shims.json
      full_room:
        tasks_json: outputs/REPLACE_SCENE_ID_factory/sim_export/pi05_tasks.json

treatments:
  - id: box_proxy_raster
    scene: box_proxy
    collision: full_room
    observation: raster
    options: {label: Primitive box proxy + raster}
  - id: simany_raster
    scene: simany
    collision: full_room
    observation: raster
    options: {label: Factorized SimAny twin + raster}
  - id: shims_raster
    scene: simany
    collision: private_shims
    observation: raster
    options: {label: Private support shims + raster}
  - id: simany_raw
    scene: simany
    collision: full_room
    observation: composite_raw
    options:
      label: Raw photoreal composite
      source_factory: robo.rendering.harness_composite_obs:build_observer
      camera_names:
        observation/exterior_image_1_left: ext_cam
        observation/wrist_image_left: wrist_cam
  - id: simany_harmony_c
    scene: simany
    collision: full_room
    observation: harmonizer_c
    options:
      label: Harmonizer + robot restoration (C)
      source_factory: robo.rendering.harness_composite_obs:build_observer
      camera_names:
        observation/exterior_image_1_left: ext_cam
        observation/wrist_image_left: wrist_cam
      robot_roots: [panda, franka, robotiq]
      enhancer:
        backend: socket
        socket: /tmp/simany_harmonizer.sock
        timeout_s: 30
      restoration: {erode_px: 1, dilate_px: 4}

comparisons:
  - id: scene_construction
    axis: scene
    baseline: box_proxy_raster
    treatments: [box_proxy_raster, simany_raster]
  - id: collision
    axis: collision
    baseline: shims_raster
    treatments: [shims_raster, simany_raster]
  - id: policy_observation
    axis: observation
    baseline: simany_raster
    treatments: [simany_raster, simany_raw, simany_harmony_c]
