# Fields that must be byte-identical between "reconstructed" and "reference"
# (or "oracle") conditions within one track. A manifest diff (robo/manifest,
# Task 01) that shows any of these differing between two runs being compared
# is a contract violation, not a result.
#
# Values here are the CURRENT frozen defaults, sourced from docs/ROBOT.md.
# Changing a value requires a new frozen_fields version and a change-log
# entry in docs/ICRA_RESEARCH_CONTRACT.md section 6.

version: 1

control:
  rate_hz: 15
  physics_dt: 0.0016666667   # 1/600
  substeps_per_tick: 40
  action_dim: 8              # 7 absolute joint targets + 1 gripper
  action_convention: absolute_joint_position
  gripper_binarize_threshold: 0.5
  per_tick_joint_delta_clamp_rad: 0.2
  horizon_seconds: 32         # docs/ROBOT.md: the 16s suite default is wrong for benchmark use

robot:
  arm: panda_nohand
  gripper: robotiq_2f85
  gripper_mount_quat_note: "SERL -90deg z mount"
  reset_pose_rad: [0, -0.6283185307, 0, -2.5132741229, 0, 1.8849555922, 0]  # [0,-pi/5,0,-4pi/5,0,3pi/5,0]

cameras:
  exterior: "left-ZED-equivalent, must be a real scan-trajectory pose (docs/ROBOT.md: synthetic offsets render as splat mush)"
  wrist: "wrist_image_left, known near-field softness 10-30cm, tracked as a limitation not tuned around"
  resolution: [640, 360]

rubric:
  stages: [grasp, lift, hover, place]
  credit_per_stage: 0.25
  success_definition: "place held for 1.0s"

observation_preprocessing:
  modes: [raster, composite]
  note: "composite mode is one scene per process; never mix modes within one comparison"

policies:
  - id: pi05_droid_jointpos
    checkpoint_path: ${OPENPI_DATA_HOME}/openpi-assets-simeval/
    config: pi05_droid_jointpos
    action_output: joint_delta_chunk_15x8
  - id: droid_pi05_jointpos_with_web_and_sim
    checkpoint_path: ${OPENPI_DATA_HOME}/openpi-assets-simeval/droid_pi05_jointpos_with_web_and_sim/80000
    config: pi05_droid_jointpos_sim
    action_output: joint_delta_chunk_15x8
  - id: scripted_sinusoid
    checkpoint_path: null
    config: null
    action_output: scripted_smoke_test_only

demo_only_overrides_never_for_benchmark:
  - --ext-cam-frame
  - --demo-declutter
  - --render-wh
