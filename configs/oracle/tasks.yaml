# Task 14 oracle-causal benchmark: scene/task manifest.
#
# wds_shard_hints discovered by sampling ~15 shards spread across
# ${SIMANY_ROOT}/data/behavior/wds/train/ on 2026-08-16 (see
# docs/ORACLE_PROTOCOL.md "data availability" section for why WDS shards are
# used instead of the HDF5 tree agents/recon/behavior_extract.py expects --
# that tree no longer exists on disk). oracle/capture_generator.py falls
# back to a bounded directory scan if a hint goes stale.
wds_shard_hints:
  task-0002: train/train-rank00-000001.tar
  task-0011: train/train-rank06-000023.tar
  task-0016: train/train-rank00-000034.tar
  task-0020: train/train-rank12-000045.tar
  task-0023: train/train-rank01-000054.tar
  task-0027: train/train-rank04-000066.tar
  task-0045: train/train-rank10-000089.tar

# Degradation levels applied by `oracle/capture_generator.py degrade`.
# Magnitudes are logged verbatim per-frame into <scene>/degradation_manifest.json
# (the "controlled perturbation magnitude is recoverable from metadata" test
# in plan/14 reads that file back and diffs against this table).
degradation_levels:
  clean:
    view_keep_frac: 1.00
    pose_noise_pos_m: 0.000
    pose_noise_rot_deg: 0.0
    blur_sigma_px: 0.0
    depth_noise_rel_std: 0.000
    occlusion_frac: 0.00
  mild:
    view_keep_frac: 0.70
    pose_noise_pos_m: 0.010
    pose_noise_rot_deg: 1.0
    blur_sigma_px: 1.0
    depth_noise_rel_std: 0.010
    occlusion_frac: 0.05
  severe:
    view_keep_frac: 0.40
    pose_noise_pos_m: 0.030
    pose_noise_rot_deg: 4.0
    blur_sigma_px: 3.0
    depth_noise_rel_std: 0.030
    occlusion_frac: 0.20

# scenes: one entry per (task_id, extracted scene dir). movable_objects use
# the real mesh_short() names read back from each scene's own
# gt/gt_objects.json AFTER extraction (2026-08-16) -- not guessed.
#
# gt_confidence is derived from gt_objects.json's max_pos_drift_m for that
# mesh (the spread of its own recovered position across the clips/episodes
# pooled into this extraction): "high" (<0.05m) / "medium" (<0.5m) / "low"
# (>=0.5m, real episode-to-episode relocation, e.g. produce clutter that is
# genuinely placed differently each episode -- kept in the scene as a
# clutter/occlusion distractor, but NOT used for the primary pose-error
# metric since its own GT anchor is multi-episode-ambiguous). See
# docs/ORACLE_PROTOCOL.md "ground-truth confidence" for the full rationale
# and the cross-clip-registration caveat it depends on.
scenes:
  - scene_id: behavior_task0020
    task_id: task-0020
    family: clutter_kitchen
    extracted_via: hdf5   # the ORIGINAL pilot scene, extracted before the
                          # HDF5 tree was reclaimed; not re-extracted here.
    notes: >
      Existing pilot scene (docs/GAP_STUDY.md / ICRA_RESEARCH_CONTRACT.md
      oracle_causal row). Dense produce clutter: leek/broccoli/onion/corn/
      basket all show >2.7m cross-episode drift (genuinely re-placed every
      episode, not a registration artifact -- this scene's own furniture
      shows exactly 0.0 drift under the same accounting), which is why it
      is the clutter/occlusion exemplar rather than a support/receptacle one.
    movable_objects:
      - {mesh: mixing_bowl_222, fixture: countertop_kelker_0, relation: OnTop, gt_confidence: medium}
      - {mesh: mixing_bowl_223, fixture: countertop_kelker_0, relation: OnTop, gt_confidence: medium}
      - {mesh: wicker_basket_221, fixture: dishwasher_ynrhuk_0, relation: Inside, gt_confidence: low}

  - scene_id: behavior_task0011
    task_id: task-0011
    family: receptacle_dishware
    extracted_via: wds
    extract_args: {episodes: 6, static_only: true}
    notes: "Kitchen dish put-away; bar counter as the receptacle surface."
    movable_objects:
      - {mesh: plate_213, fixture: bar_udatjt_0, relation: OnTop, gt_confidence: medium}
      - {mesh: plate_212, fixture: bar_udatjt_0, relation: OnTop, gt_confidence: medium}

  - scene_id: behavior_task0023
    task_id: task-0023
    family: support_shelf
    extracted_via: wds
    extract_args: {episodes: 2, static_only: true}
    notes: "Classic support relation: book(s) on a bookcase shelf."
    movable_objects:
      - {mesh: hardback_51, fixture: bookcase_otwukr_0, relation: OnTop, gt_confidence: high}
      - {mesh: hardback_54, fixture: bookcase_otwukr_0, relation: OnTop, gt_confidence: medium}

  - scene_id: behavior_task0027
    task_id: task-0027
    family: clutter_bathroom
    extracted_via: wds
    extract_args: {episodes: 3, static_only: true}
    notes: >
      Second, distinct-room clutter/occlusion exemplar (bathroom vs
      task-0020's kitchen): several small, partly thin/low-point-count
      objects (toothbrush, toothpaste tube) clustered on a narrow shelf.
    movable_objects:
      - {mesh: soap_dispenser_223, fixture: shelf_fjozhc_0, relation: OnTop, gt_confidence: high}
      - {mesh: bottle_of_detergent_227, fixture: multi_station_furniture_sink_upwldu_0, relation: OnTop, gt_confidence: medium}
      - {mesh: box_of_sanitary_napkins_224, fixture: floor, relation: OnTop, gt_confidence: medium}

  - scene_id: behavior_task0045
    task_id: task-0045
    family: obstacle_kitchen
    extracted_via: wds
    extract_args: {episodes: 6, static_only: true}
    notes: >
      Obstacle family: fridge/oven/cabinets form large fixed obstacles
      between plausible robot approach poses and the countertop target.
    movable_objects:
      - {mesh: hotdog_208, fixture: countertop_kelker_0, relation: OnTop, gt_confidence: medium}

  - scene_id: behavior_task0002
    task_id: task-0002
    family: support_mantle
    extracted_via: wds
    extract_args: {episodes: 3, static_only: true}
    notes: "Simple, low-clutter support case: single decor object near a fireplace mantle/countertop."
    movable_objects:
      - {mesh: pumpkin_93, fixture: countertop_tpuwys_0, relation: OnTop, gt_confidence: high}
