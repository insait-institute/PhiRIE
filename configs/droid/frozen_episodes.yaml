# DROID reconstruction track (plan Task 16 / contract track `droid_replay`) —
# frozen, stratified episode list.
#
# Frozen: 2026-08-16. Source pool: ${SIMANY_ROOT}/data/droid/raw (raw DROID
# release, fetched by run/fetch_droid_raw.py from the episodes referenced in
# the local droid_100 RLDS shards). Re-generate the pool summary with:
#   .venv/bin/python -c "
#   import json,glob
#   from pathlib import Path
#   for mp in sorted(Path('${SIMANY_ROOT}/data/droid/raw').glob('*/*/*/*/metadata_*.json')):
#       print(json.loads(mp.read_text())['uuid'])"
#
# WHY freeze this list at all (rather than pick episodes ad hoc per run):
# the contract (docs/ICRA_RESEARCH_CONTRACT.md, track `droid_replay`) commits
# to reporting replay/coverage evidence honestly, which requires the episode
# set to be chosen BEFORE looking at how well each one reconstructs — no
# survivorship bias from silently dropping the ones that give ugly splats.
#
# ---------------------------------------------------------------------------
# POOL SUMMARY (all locally-fetched raw episodes, audited 2026-08-16)
# ---------------------------------------------------------------------------
pool:
  n_episodes: 47
  labs: [AUTOLab, CLVR, IPRL, IRIS, PennPAL, RAIL, REAL, RPL, TRI]
  n_by_lab: {AUTOLab: 7, CLVR: 3, IPRL: 5, IRIS: 4, PennPAL: 3, RAIL: 5,
             REAL: 2, RPL: 4, TRI: 14}
  # KNOWN GAP: every locally-fetched episode has success=true. This is a
  # fetch-time artifact, not a DROID property: run/fetch_droid_raw.py's
  # episode_paths() regex is anchored on the literal "success/" path
  # component because that is what the local droid_100 RLDS shards (the
  # seed list fetch_droid_raw.py walks) happen to reference. The raw DROID
  # release also has failure/contact-only episodes under other lab
  # directories; none are fetched yet. Until some are, this track cannot
  # stratify by success/failure at all - flagged here rather than silently
  # treating "success" as a property of the reconstruction pipeline.
  success_failure: "47/47 success=true (fetch-time gap, see note above); 0 failure episodes available locally"
  trajectory_length_frames: {min: 93, median: 214, max: 1140}
  camera_quality:
    hd_1280x720: 46      # standard DROID wrist-cam MP4 resolution
    sd_672x376: 1         # IRIS/2023-03-07 only - lower-res wrist cam that day
    wrist_mp4_missing: 1  # PennPAL/2023-10-18 - metadata present, MP4 absent;
                           # excluded below, needs re-fetch via run/gcs_fetch.py
  task_families:          # bucketed from metadata current_task (free text
                           # for AUTOLab, a fixed rubric string for the rest)
    - "move object into/out of container"
    - "move/reorient object"
    - "fold/spread/clump cloth"
    - "cover/uncover with cloth"
    - "open/close slidable (drawer/toaster/curtain)"
    - "turn twistable (faucet/knob)"
    - "move lid on/off container"
    - "hang/unhang object"
    - "ad hoc short imperative (AUTOLab free-text, e.g. 'put duck in pot')"
    - "multi-step / compound (RPL, TRI 'do any N tasks')"

# ---------------------------------------------------------------------------
# STRATIFICATION CRITERIA (documented for scaling to the 3-lab/10-workspace
# acceptance bar and beyond - this pass only reconstructs `priority_batch_v1`)
# ---------------------------------------------------------------------------
stratification_axes:
  - lab: "9 available; cross-site generalization is the whole point of this
      track, so no lab should be over-represented in what actually gets
      reconstructed and reported."
  - task_family: "listed above; avoid freezing 10 workspaces that are all
      the same manipulation primitive."
  - trajectory_length_tier: "short <150 frames, medium 150-400, long >400 -
      proxy for episode complexity/duration; long episodes cost more
      COLMAP+gsplat compute and are more likely to have large joint-velocity
      stretches that starve droid_extract's static-frame filter ladder
      (agents/recon/droid_extract.py FILTER_LADDER)."
  - camera_quality_tier: "hd (1280x720) vs sd (672x376) - a real image-
      quality axis found in this pool (IRIS/2023-03-07); reconstructions
      should be evaluated separately by tier, not pooled, since COLMAP
      registration rate and splat PSNR both depend on source resolution."
  - success_failure: "not currently satisfiable (see pool.success_failure
      gap above); revisit once failure episodes are fetched."

# ---------------------------------------------------------------------------
