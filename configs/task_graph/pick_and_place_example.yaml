# Real example task_graph config (Task 11), documenting every field a real
# deployment would fill in. This is the same task-manifest shape consumed by
# `python -m robo.certification.task_graph --task <this file> --scene <dir>`
# and by robo/certification/task_graph.load_task() -- tests/data/tasks/*.yaml
# are the synthetic unit-test fixtures exercising individual resolution
# paths; this file is the template an agent wiring up a *real* scene should
# copy and edit.
#
# NOTE: task_graph's scene manifest (scene.yaml: robot/cameras/objects with
# world-frame aabb+pose) is a new, minimal schema introduced for this task.
# There is no converter yet from a real build's objects/objects.json +
# sim_export/mujoco_settle.json (the schema robo/tasks/pi05_tasks.py reads)
# into this scene.yaml shape -- that converter is a follow-up integration
# step, not built here (see final report). Once it exists, this task config
# is what you would point it at alongside the converted scene.

task_id: pick_and_place_example

language:
  # Free-text instruction, run through grounding.parse_instruction()'s small
  # pattern-matcher as one (never the only) source of role evidence.
  instruction: "pick up the mug and put it in the tray"

rubric:
  # Per-role label evidence -- matched against scene object labels with
  # grounding.label_match_score() (exact or token-overlap).
  role_labels:
    manipulated_object: mug
    receptacle: tray

  # Optional explicit benchmark_mapping lookup table: {role: scene_object_id}.
  # Use this when a benchmark provides a ground-truth instance id (e.g. a
  # PolaRiS/BEHAVIOR task definition) -- it is a human/benchmark annotation,
  # never a policy-evaluation result, so plan/11's no-leakage rule permits
  # it. Omit entirely (as here) to resolve purely from labels/language/geometry.
  # role_refs:
  #   manipulated_object: obj_01
  #   receptacle: obj_00

  # Optional per-role spatial disambiguator, applied only when a role still
  # has >1 candidate after label/language/benchmark evidence: one of
  # leftmost / rightmost / nearest_to_base / farthest_from_base.
  # spatial_hints:
  #   manipulated_object: nearest_to_base

# Roles this task cares about resolving through language/rubric evidence.
# 'support' and 'obstacle' are always computed (derived from geometry, not
# language) and don't need to be listed here.
roles: [manipulated_object, receptacle]

# Per-task override of the swept-workspace capsule (else falls back to
# configs/task_graph/default_thresholds.yaml's capsule_defaults, else this
# module's DEFAULT_CAPSULE_RADIUS_M / DEFAULT_LIFT_M).
capsule_radius_m: 0.12
lift_m: 0.12
